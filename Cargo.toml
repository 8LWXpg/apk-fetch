[workspace]
resolver = "2"
members = [
  "crates/cli",
  "crates/core",
  "crates/fetch",
  "crates/providers/apkcombo",
  "crates/providers/apkmirror",
  "crates/providers/apkpure",
  "crates/providers/uptodown",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
apk-fetch-apkcombo = { path = "crates/providers/apkcombo" }
apk-fetch-apkmirror = { path = "crates/providers/apkmirror" }
apk-fetch-apkpure = { path = "crates/providers/apkpure" }
apk-fetch-core = { path = "crates/core" }
apk-fetch-fetch = { path = "crates/fetch" }
apk-fetch-uptodown = { path = "crates/providers/uptodown" }

# Exact pins: this is a scraper — a direct-dep API change breaks parsing silently.
# Bump deliberately; the committed Cargo.lock keeps transitive deps reproducible too.
anyhow = "=1.0.104"
async-trait = "=0.1.92"
clap = { version = "=4.6.6", features = ["derive"] }
colored = "=2.2.0"
indicatif = "=0.17.11"
scraper = "=0.20.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["full"] }

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1
