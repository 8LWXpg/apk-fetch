[package]
name = "apk-fetch"
version = "1.0.0"
edition = "2024"
license = "MIT"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "zip"
disabled-strategies = ["quick-install", "compile"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bitflags = "2"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.0.0"
form_urlencoded = "1.2.2"
percent-encoding = "2.3.2"
scraper = { version = "0.27.0", default-features = false, features = ["errors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = {
  version = "1.53.1",
  features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt",
    "signal",
    "sync",
    "time",
  ]
}
unicode-width = "0.2.2"

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1
