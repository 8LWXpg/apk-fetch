[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/fetch",
    "crates/providers/apkmirror",
    "crates/providers/apkpure",
    "crates/providers/apkcombo",
    "crates/providers/uptodown",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
apk-fetch-core = { path = "crates/core" }
apk-fetch-fetch = { path = "crates/fetch" }
apk-fetch-apkmirror = { path = "crates/providers/apkmirror" }
apk-fetch-apkpure = { path = "crates/providers/apkpure" }
apk-fetch-apkcombo = { path = "crates/providers/apkcombo" }
apk-fetch-uptodown = { path = "crates/providers/uptodown" }

async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
scraper = "0.20"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
colored = "2"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
