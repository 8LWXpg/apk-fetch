[package]
name = "apk-fetch"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "apk-fetch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
colored = "2.2.0"
scraper = { version = "0.20.0", default-features = false, features = ["errors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }
unicode-width = "0.2.2"

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1
